<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход · Испытания</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Вход в систему</h1>
    <p class="sub">Испытания: обучение и тестирование</p>
    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <div class="field">
        <label for="email">Почта</label>
        <input id="email" type="email" name="email" required autocomplete="username" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input id="password" type="password" name="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button class="btn" style="width:100%">Войти</button>
    </form>

    <div class="demo-box">
      <div class="demo-title">демо-доступы</div>
      <button type="button" class="demo-row" onclick="fillDemo('teacher')">
        <span class="demo-badge teacher">П</span>
        <span class="demo-text">
          <b>teacher@example.com</b>
          <small>пароль teacher123 · проводящий испытание</small>
        </span>
        <span class="demo-go">подставить →</span>
      </button>
      <button type="button" class="demo-row" onclick="fillDemo('student')">
        <span class="demo-badge student">У</span>
        <span class="demo-text">
          <b>student@example.com</b>
          <small>пароль student123 · учащийся</small>
        </span>
        <span class="demo-go">подставить →</span>
      </button>
      <p class="demo-note">Демонстрационные аккаунты. После первого входа смените пароль в разделе «Аккаунт».</p>
    </div>

    <div class="auth-foot">Нет аккаунта? <a href="/register">Зарегистрироваться</a></div>
  </div>
</div>
<script src="/static/js/auth.js"></script>
</body>
</html>
