<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход · Испытания</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Вход в систему</h1>
    <p class="sub">Испытания: обучение и тестирование</p>
    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <div class="field">
        <label for="email">Почта</label>
        <input id="email" type="email" name="email" required autocomplete="username" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input id="password" type="password" name="password" required autocomplete="current-password">
      </div>
      <button class="btn" style="width:100%">Войти</button>
    </form>
    <div class="auth-foot">Нет аккаунта? <a href="/register">Зарегистрироваться</a></div>
  </div>
</div>
</body>
</html>
